<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>
    <style>
        body{
            text-align:center;
            font-family:Arial;
        }
        img{
            width:300px;
            height:300px;
        }
        .brightness{
            filter: brightness(150%);
        }
        .blur{
            filter: blur(3px);
        }
        .contrast{
            filter: contrast(200%);
        }
        .grayscale{
            filter: grayscale(100%);
        }
        .sepia{
            filter: sepia(100%);
        }
        .hue{
            filter: hue-rotate(180%);
        }
        .invert{
            filter: invert(100%);
        }
        .opacity{
            filter: opacity(50%);
        }
        .saturate{
            filter: saturate(250%);
        }
        .shadow{
            filter: drop-shadow(5px 5px 8px red);
        }
    </style>
</head>
<body>
    <h2>CSS Filter</h2>
    <h3>Original Image</h3>
    <img src='/Users/vyshnavi/Downloads/WhatsApp Image 2026-09-07 at 21.38.20.jpeg' alt="Image">
    <h3>Brightness</h3>
    <img src='/Users/vyshnavi/Downloads/WhatsApp Image 2026-09-07 at 21.38.20.jpeg' class="brightness">
    <h3>Blur</h3>
    <img src='/Users/vyshnavi/Downloads/WhatsApp Image 2026-09-07 at 21.38.20.jpeg' class="blur">
    <h3>Contrast</h3>
    <img src='/Users/vyshnavi/Downloads/WhatsApp Image 2026-09-07 at 21.38.20.jpeg' class="contrast">
    <h3>Grayscale</h3>
    <img src='/Users/vyshnavi/Downloads/WhatsApp Image 2026-09-07 at 21.38.20.jpeg' class="grayscale">
    <h3>Sepia</h3>
    <img src='/Users/vyshnavi/Downloads/WhatsApp Image 2026-09-07 at 21.38.20.jpeg' class="sepia">
    <h3>Hue Rotate</h3>
    <img src='/Users/vyshnavi/Downloads/WhatsApp Image 2026-09-07 at 21.38.20.jpeg' class="hue">
    <h3>Invert</h3>
    <img src='/Users/vyshnavi/Downloads/WhatsApp Image 2026-09-07 at 21.38.20.jpeg' class="invert">
    <h3>Opacity</h3>
    <img src='/Users/vyshnavi/Downloads/WhatsApp Image 2026-09-07 at 21.38.20.jpeg' class="opacity">
    <h3>Saturate</h3>
    <img src='/Users/vyshnavi/Downloads/WhatsApp Image 2026-09-07 at 21.38.20.jpeg' class="saturate">
    <h3>Drop Shadow</h3>
    <img src='/Users/vyshnavi/Downloads/WhatsApp Image 2026-09-07 at 21.38.20.jpeg' class="shadow">
</body>
</html>
