<html>
    <head>
        <title>Facebook Login</title>
        <style>
            form{
                border:1px solid black;
                width:500px;
                margin-left:400px;
                margin-top:100px;
                padding:30px;
                border-radius:20px;
                box-shadow:4px 8px 10px black;
            }
            input{
                border:1px solid black;
                width:450px;
                height:40px;
                margin-bottom:15px;
            }
            label{
                padding-left:5px;
            }
            h1{
                text-align:center;
            }
            #i1{
                width:450px;
                height:45px;
                background-color:rgb(0, 106, 255);
                color:white;
                border:none;
                border-radius:20px;
            }
            #i2{
                width:450px;
                height:40px;
                border:none;
                background-color:white;
            }
            #i3{
                width:450px;
                height:40px;
                border:1px solid rgb(9, 111, 236);
                background-color:white;
                color:rgb(6, 120, 242);
                border-radius:20px;
            }
            p{
                text-align:center;
            }
        </style>
    </head>
    <body>
        <form>
            <h1>Log in to Facebook</h1>
            <input type="text" required placeholder="Email address or mobile number " required>
            <br><br>
            <input type="password" required placeholder="Enter Your Password" required>
            <br><br>
            <button id="i1">Log in</button>
            <br><br>
            <button id="i2">Forgotten password?</button>
            <br><br>
            <button id="i3">Create new account</button>
            <p>meta</p>
        </form>
    </body>
</html>
