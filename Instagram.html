<html>
    <head>
        <title>Instagram Login</title>
        <style>
            form{
                border:1px solid black;
                width:500px;
                margin-left:400px;
                margin-top:100px;
                padding:30px;
                border-radius:20px;
                box-shadow:4px 8px 10px black;
            }
            input{
                border:1px solid black;
                width:450px;
                height:40px;
                margin-bottom:15px;
            }
            label{
                padding-left:5px;
            }
            h1{
                text-align:center;
            }
            #i1{
                width:450px;
                height:45px;
                background-color:rgb(49, 115, 154);
                color:white;
                border:none;
                border-radius:20px;
            }
            #i2{
                width:450px;
                height:45px;
                border:none;
                background-color:white;
            }
            #i3{
                width: 450px;
                height:45px;
                border:none;
                border-radius:20px;
                background-color:rgb(248, 245, 245);
            }
            #i4{
                width:450px;
                height:40px;
                border:1px solid rgb(0, 119, 255);
                background-color:white;
                color:rgb(0, 0, 255);
                border-radius:20px;
            }
            p{
                text-align:center;
            }
            #i2:hover{
                background-color:rgb(240, 240, 240);
            }
            #i3:hover{
                background-color:rgb(240, 240, 240);
            }
        </style>
    </head>
    <body>
        <form>
            <h1>Log into instagram </h1>
            <input type="text" required placeholder="Mobile number, username or email" required>
            <br><br>
            <input type="password" required placeholder="Enter Your Password" required>
            <br><br>
            <button id="i1">Log in</button>
            <br><br>
            <button id="i2">Forgot password?</button>
            <br><br>
            <button id="i3">Log in with Facebook</button>
            <br><br>
            <button id="i4">Create new account</button>
            <p>Meta</p>
        </form>
    </body>
</html>
