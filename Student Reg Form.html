<html>
    <head>
        <title>
            Student Registration Form
        </title>
        <style>
            form {
                border:1px solid black;
                width: 600px;
                margin-left: 400px;
                margin-top:40px;
                background-color: rgb(149, 181, 136);
                border-radius:20px;
                box-shadow: 4px 8px 10px black;
            }
            input{
                border:none;
            }
            label{
                padding-left:150px;
            }
            h1{
                text-align:center;
            }
            #i1{
                margin-left:28px;
                width:200px;
                height:30px;
            }
            #i2{
                margin-left:33px;
                width:200px;
                height:30px;
            }
            #i3{
                margin-left:38px;
                width:200px;
                height:30px;
            }
            #i4{
                margin-left:38px;
                width:200px;
                height:30px;
            }
            #i5{
                margin-left:22px;
                width:200px;
                height:30px;
                border:none;
            }
            #i6{
                width:200px;
                height:30px;
            }
            #i7{
                margin-left:30px;
                width:200px;
                height:30px;
            }
            #i8{
                margin-left:35px;
                width:200px;
                height:30px;
            }
            #i9{
                margin-left:15px;
                width:200px;
                height:30px;
            }
            #i10{
                margin-left:22px;
                width:200px;
                height:30px;
            }
            #i11{
                margin-left: 150px;
                width: 100px;
                height: 30px;
                margin-bottom: 20px;
                background-color:brown;
                border-radius:10px;
            }
            #i12{
                padding-left:15px;
                width:100px;
                height:30px;
                margin-left:30px;
                background-color:brown;
                border-radius:10px;
            }
            #i11:hover{
                background-color: coral;
            }
            #i12:hover{
                background-color:chocolate;
            }
        </style>
    </head>
    <body>
        <form>
            <h1>Student Registration Form</h1>
            <label>Reg Id:</label>
            <input type="number" id="i1" required placeholder="Enter Your regression Id">
            <br><br>
            <label>Name:</label>
            <input type="text" id="i2" required>
            <br><br>
            <label>Gender:</label>
            <input type="radio" name="gender">
            <label>Male</label>
            <input type="radio" name="gender">
            <label>Female</label>
            <input type="radio" name="gender">
            <label>Other</label>
            <br><br>
            <label>DOB:</label>
            <input type="date" id="i3" required>
            <br><br>
            <label>Phno:</label>
            <input type="number" id="i4" required>
            <br><br>
            <label>Address:</label>
            <textarea id="i5" required></textarea>
            <br><br>
            <label>Department:</label>
            <input type="text" id="i6" required>
            <br><br>
            <label>Course:</label>
            <input type="text" id="i7" required>
            <br><br>
            <label>Email:</label>
            <input type="email" id="i8" required>
            <br><br>
            <label>Password:</label>
            <input type="password" id="i9" required>
            <br><br>
            <label>Resume:</label>
            <input type="file" id="i10">
            <br><br>
            <button id="i11">Submit</button>
            <button id="i12">Reset</button>
        </form>
    </body>
</html>
